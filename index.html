<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto Galería - Why Not</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <h1>Galería de Fotos - Why Not</h1>
        <p>Recuerdos inolvidables de nuestro gran día</p>
    </header>

    <main class="container">
        <!-- Pestañas de navegación -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('invitados')">Invitados</button>
            <button class="tab-btn" onclick="switchTab('fotomaton')">Fotomatón</button>
            <button class="tab-btn" onclick="switchTab('fotografa')">Fotógrafa</button>
            <button class="tab-btn" onclick="switchTab('fotosapp')">FotosApp</button>
        </div>

        <!-- Secciones / Contenido de las pestañas -->
        <!-- NOTA: Reemplaza las URLs de las imágenes con las rutas de tus fotos o enlaces directos -->
        
        <section id="invitados" class="tab-content active">
            <h2>Invitados</h2>
            <div class="gallery-grid">
                <div class="gallery-item" onclick="openLightbox(this)">
                    <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=800&q=80" alt="Boda Invitados 1">
                </div>
                <div class="gallery-item" onclick="openLightbox(this)">
                    <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80" alt="Boda Invitados 2">
                </div>
                <!-- Añade más elementos aquí -->
            </div>
        </section>

        <section id="fotomaton" class="tab-content">
            <h2>Fotomatón</h2>
            <div class="gallery-grid">
                <div class="gallery-item" onclick="openLightbox(this)">
                    <img src="https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&fit=crop&w=800&q=80" alt="Fotomatón 1">
                </div>
            </div>
        </section>

        <section id="fotografa" class="tab-content">
            <h2>Fotógrafa Oficial</h2>
            <div class="gallery-grid">
                <div class="gallery-item" onclick="openLightbox(this)">
                    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" alt="Fotógrafa 1">
                </div>
            </div>
        </section>

        <section id="fotosapp" class="tab-content">
            <h2>FotosApp</h2>
            <div class="gallery-grid">
                <div class="gallery-item" onclick="openLightbox(this)">
                    <img src="https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=800&q=80" alt="FotosApp 1">
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Lightbox para ampliar imagen -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close">&times;</span>
        <img id="lightbox-img" src="" alt="Imagen ampliada">
    </div>

    <script src="script.js"></script>
</body>
</html>
